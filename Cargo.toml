[package]
name = "drm-vblank-monitor"
version = "0.1.0"
edition = "2021"
authors = ["Americo Simoes"]
description = "Real-time DRM VBLANK monitor and frame timing diagnostic tool"
license = "GPL-3.0-or-later"

[dependencies]
nix = { version = "0.29", features = ["fs", "ioctl", "time"] }
libc = "0.2"
clap = { version = "4.4", features = ["derive"] }
